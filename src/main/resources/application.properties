spring.application.name=calendar

spring.datasource.url=jdbc:h2:mem:learning_spring
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=Bernard
spring.datasource.password=


spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


spring.profiles.default=default

rsa.rsa-public-key=classpath:certs/public.pem
rsa.rsa-private-key=classpath:certs/private.pem